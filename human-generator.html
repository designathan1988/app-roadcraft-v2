<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerador de humanos — Roadcraft</title>
  <style>
    :root { --bg: rgba(18, 20, 24, 0.88); --line: rgba(255, 255, 255, 0.14); --text: #f2f2f0; --muted: #a9adb3; --accent: #7fd4ff; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #3a3d42; font: 13px system-ui, sans-serif; color: var(--text); }
    #view { width: 100%; height: 100%; display: block; }
    .panel { position: fixed; left: 12px; top: 12px; width: 268px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .panel h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    button, select { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; cursor: pointer; font: inherit; }
    select { width: 100%; }
    select option { color: #000; }
    button:hover, button.on { border-color: var(--accent); color: var(--accent); }
    .group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 8px 0 2px; }
    .slider { display: grid; grid-template-columns: 74px 1fr 52px; align-items: center; gap: 6px; height: 24px; }
    .slider span { color: var(--muted); white-space: nowrap; }
    .slider output { text-align: right; font-variant-numeric: tabular-nums; }
    .slider input { width: 100%; accent-color: var(--accent); }
    #readout { color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
    #status { position: fixed; right: 12px; top: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: 12px; }
    #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="panel">
    <h1 data-i18n="hgen.title"></h1>
    <div class="row">
      <button id="reroll" data-i18n="hgen.reroll"></button>
      <button id="reroll-one" data-i18n="hgen.rerollOne"></button>
      <button id="ages" data-i18n="hgen.ages"></button>
    </div>
    <div class="row" id="views">
      <button data-view="front" class="on" data-i18n="hgen.front"></button>
      <button data-view="side" data-i18n="hgen.side"></button>
      <button data-view="back" data-i18n="hgen.back"></button>
      <button data-view="face" data-i18n="hgen.face"></button>
    </div>
    <div id="sliders"></div>
    <div id="readout"></div>
  </div>
  <div id="hint" data-i18n="hgen.hint"></div>
  <div id="status" data-i18n="hgen.loading"></div>
  <script type="module" src="/src/humanGenerator.ts"></script>
</body>
</html>
