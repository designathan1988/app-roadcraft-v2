<!doctype html>
<html lang="en" data-ui="v2">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#152119" />
  <title data-i18n="app.title">Roadcraft — Road Builder</title>
  <!-- Inline so the first paint never waits on a request, and so the build has
       no stray asset to copy. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23152119'/%3E%3Cpath d='M6 22 16 5l10 17-10 5Z' fill='none' stroke='%237ee0b8' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/ui/app.css" />
</head>
<body>
  <main id="app" data-i18n-label="app.region" aria-label="Roadcraft road builder">
    <canvas id="game" tabindex="0" role="application" data-i18n-label="app.canvas" aria-label="Interactive city map" aria-describedby="v2Hint"></canvas>
    <!-- The Builder Workspace (the buildings module&#39;s own interface) is built
         in TypeScript by src/ui/builder/workspace.ts and mounted here. -->
    <section id="builder" data-i18n-label="builder.label" aria-label="Builder workspace"></section>

    <section id="inspector" class="inspector glass hidden" aria-hidden="true" aria-labelledby="inspectorTitle" hidden>
      <div class="panel-title"><span id="inspectorTitle" data-i18n="inspector.title">INSPECT</span><button type="button" id="closeInspector" class="tiny-button" data-i18n-label="inspector.close" aria-label="Close inspector">×</button></div>
      <div id="inspectorBody"></div>
    </section>

  </main>
  <dialog id="aboutDialog" class="about-dialog glass">
    <h2 data-i18n="about.title">About Roadcraft</h2>
    <p><strong data-i18n="about.build">Build</strong> <span id="aboutBuild"></span></p>
    <div id="aboutCredits"></div>
    <form method="dialog"><button class="about-close" data-i18n="about.close">Close</button></form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
