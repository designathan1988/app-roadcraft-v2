<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratório de pessoas — Roadcraft</title>
  <style>
    :root { --bg: rgba(12, 25, 27, 0.86); --line: rgba(187, 235, 224, 0.18); --text: #f4fbf8; --muted: #9eb7b2; --accent: #65e5c3; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd3e0; font: 14px system-ui, sans-serif; color: var(--text); }
    #lab { width: 100%; height: 100%; display: block; }
    .panel { position: fixed; left: 12px; top: 12px; width: 300px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .panel h1 { font-size: 15px; margin: 0 0 8px; }
    .panel p { color: var(--muted); font-size: 12px; margin: 0 0 10px; line-height: 1.4; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    button, select { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
    select option { color: #000; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    #stats { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
    #stats b { color: var(--text); }
    #info { position: fixed; right: 12px; top: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
    #status { position: fixed; left: 12px; right: 12px; bottom: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="lab"></canvas>
  <div class="panel">
    <h1>Pessoas procedurais</h1>
    <p>Um corpo MakeHuman por classe (sexo × idade). Cada pessoa é só números: o formato do corpo, as cores e as peças que veste. Roupa, cabelo, sapato, sobrancelha e cílios são peças separadas.</p>
    <div class="row">
      <button id="again">Sortear outras</button>
      <button id="walk">Parar todos</button>
      <select id="count">
        <option value="20">20 pessoas</option>
        <option value="60" selected>60 pessoas</option>
        <option value="120">120 pessoas</option>
        <option value="240">240 pessoas</option>
      </select>
    </div>
    <div class="row">
      <button id="close">Ver de perto</button>
      <button id="far">Ver de longe</button>
    </div>
    <div id="stats"></div>
  </div>
  <div id="info"></div>
  <div id="status">Carregando o corpo base...</div>
  <script type="module" src="/src/render/people/peopleLab.ts"></script>
</body>
</html>
