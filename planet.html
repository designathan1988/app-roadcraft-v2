<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planeta — Roadcraft</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #04060c; font: 14px system-ui, sans-serif; color: #eef2f4; }
    #planet { width: 100%; height: 100%; display: block; touch-action: none; }
    .bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
      background: rgba(12, 25, 27, 0.78); border: 1px solid rgba(187, 235, 224, 0.18); border-radius: 10px; padding: 8px 12px; color: #9eb7b2; font-size: 13px; }
    #altitude { color: #eef2f4; white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="planet"></canvas>
  <div class="bar"><span id="hint"></span><span id="altitude"></span></div>
  <script type="module" src="/src/planet/main.ts"></script>
</body>
</html>
